<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? String(e.message) : '';
        var file = (e && e.filename) ? String(e.filename) : '';
        if (msg.includes('WebSocket') || msg.includes('@vite/client') || file.includes('@vite/client') || msg.includes('createWebSocketModuleRunnerTransport')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = (e && e.reason) ? String(e.reason) : '';
        if (reason.includes('WebSocket') || reason.includes('@vite/client') || reason.includes('createWebSocketModuleRunnerTransport')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
    <title>Noverse Workspace</title>
    <meta name="description" content="Platform produktivitas dan ruang kerja kolaboratif modular berbasis hierarki catatan, integrasi database, Markdown, kolaborasi real-time, offline sync, enkripsi end-to-end, kalender tenggat, dan analitik." />

  </head>
